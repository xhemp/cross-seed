name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build npm tarball
        run: |
          set -euo pipefail
          npm -w shared run build
          pack_dir="$(mktemp -d)"
          (cd cross-seed && npm pack --workspaces=false --pack-destination "$pack_dir")
          tarball="$(ls "$pack_dir"/cross-seed-*.tgz)"
          cp "$tarball" "$GITHUB_WORKSPACE/cross-seed.tgz"
      - name: Smoke test npm tarball
        run: |
          set -euo pipefail
          npm -C "$GITHUB_WORKSPACE" install "file:cross-seed.tgz" --no-save --omit=dev
          node "$GITHUB_WORKSPACE/node_modules/cross-seed/dist/cmd.js" --version
      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-seed-tarball
          path: cross-seed.tgz
          if-no-files-found: error

  tarball-windows:
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cross-seed-tarball
      - name: Show versions
        run: |
          node -v
          npm -v
          npm config get prefix
          npm root -g
      - name: Install tarball globally
        run: |
          npm install -g .\cross-seed.tgz
      - name: Run cross-seed
        run: |
          cross-seed --version

  docker-meta:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/cross-seed
          tags: |
            type=semver,pattern=version-{{version}}
            type=semver,pattern={{version}}
            
